services:
  web:
    image: pablosla/work-from-home-web:latest
    container_name: work-from-home-web
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      ORACLE_USER: ${ORACLE_USER}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      ORACLE_CONNECT_STRING: ${ORACLE_CONNECT_STRING}
      ORACLE_TIMERTASK_SCHEMA: ${ORACLE_TIMERTASK_SCHEMA}
      ORACLE_STAFF_LINE_IDS: ${ORACLE_STAFF_LINE_IDS}
      ORACLE_EXCLUDED_GROUP_IDS: ${ORACLE_EXCLUDED_GROUP_IDS}
      TEST_ACCOUNTS_ENABLED: ${TEST_ACCOUNTS_ENABLED}
      TEST_ACCOUNTS_PASSWORD: ${TEST_ACCOUNTS_PASSWORD}
      TEST_ACCOUNT_ADMIN: ${TEST_ACCOUNT_ADMIN}
      TEST_ACCOUNT_COORDINATOR: ${TEST_ACCOUNT_COORDINATOR}
      TEST_ACCOUNT_EMPLOYEE: ${TEST_ACCOUNT_EMPLOYEE}
      INTEGRATION_LDAP_URL: ${INTEGRATION_LDAP_URL}
      INTEGRATION_LDAP_ACCESSACCOUNT_UPN: ${INTEGRATION_LDAP_ACCESSACCOUNT_UPN}
      INTEGRATION_LDAP_ACCESSACCOUNT_PWD: ${INTEGRATION_LDAP_ACCESSACCOUNT_PWD}
      INTEGRATION_LDAP_USER_BASESEARCHGROUP: ${INTEGRATION_LDAP_USER_BASESEARCHGROUP}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
        

  postgres:
    image: postgres:18.3
    container_name: work-from-home-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
