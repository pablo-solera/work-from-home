services:
  postgres-test:
    image: postgres:18.3
    environment:
      POSTGRES_DB: work_from_home_test
      POSTGRES_USER: work_from_home_test
      POSTGRES_PASSWORD: work_from_home_test_password
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U work_from_home_test -d work_from_home_test"]
      interval: 1s
      timeout: 5s
      retries: 30
